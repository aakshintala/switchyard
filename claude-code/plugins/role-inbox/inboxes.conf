# role-inbox: which inboxes a session watches, chosen by the session's cwd.
# One line per inbox: <session-dir> <inbox>
#   <session-dir>  the session's cwd, or a directory above it; ~/ expands.
#   <inbox>        a local dir (/abs or ~/rel), or <ssh-host>:<abs-dir> on another host.
# A session whose cwd matches no line watches nothing.
~/work/fiber-worktrees/surveyor/home  ~/work/fiber-worktrees/surveyor/run/inbox
~/work/fiber-worktrees/surveyor/home  ~/.cache/agents/inbox/surveyor
~/work/fiber-worktrees/surveyor/home  roundhouse-7010-plus-1.local:/srv/lanes/fiber-worktrees/surveyor/run/inbox
~/work/sy-wt/main  ~/.cache/agents/inbox/switchyard
# flywheel joins once it drains handled files to read/: the plugin replays every *.md waiting at session start.
